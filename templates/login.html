<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Secure AI | Güvenli Giriş</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; color: #eaf4ff; background: radial-gradient(circle at 15% 20%, rgba(34, 111, 255, .22), transparent 35%), radial-gradient(circle at 85% 80%, rgba(35, 224, 175, .13), transparent 32%), #050b16; }
    body::before { content: ""; position: fixed; inset: 0; pointer-events: none; opacity: .22; background-image: linear-gradient(rgba(72, 118, 173, .18) 1px, transparent 1px), linear-gradient(90deg, rgba(72, 118, 173, .18) 1px, transparent 1px); background-size: 42px 42px; mask-image: linear-gradient(to bottom, #000, transparent 85%); }
    main { position: relative; width: min(92vw, 430px); padding: 34px; border: 1px solid rgba(116, 166, 226, .2); border-radius: 22px; background: linear-gradient(145deg, rgba(12, 25, 47, .96), rgba(7, 16, 31, .94)); box-shadow: 0 28px 80px rgba(0, 0, 0, .48), inset 0 1px rgba(255,255,255,.04); }
    .brand { display: flex; align-items: center; gap: 14px; margin-bottom: 30px; }
    .mark { display: grid; place-items: center; width: 48px; height: 48px; border: 1px solid rgba(83, 219, 255, .4); border-radius: 15px; color: #75ecff; font-weight: 800; font-size: 22px; background: rgba(26, 107, 161, .18); box-shadow: 0 0 28px rgba(53, 197, 255, .14); }
    .brand strong { display: block; font-size: 18px; letter-spacing: .02em; }
    .brand span { display: block; margin-top: 3px; color: #7890ad; font-size: 12px; }
    h1 { margin: 0 0 8px; font-size: 28px; }
    .intro { margin: 0 0 25px; color: #8fa5bf; line-height: 1.55; font-size: 14px; }
    label { display: block; margin: 15px 0 7px; color: #a9bdd5; font-size: 12px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; }
    input { width: 100%; min-height: 48px; padding: 0 14px; border: 1px solid rgba(109, 151, 202, .24); border-radius: 12px; outline: none; color: #eef8ff; background: rgba(3, 10, 22, .72); transition: .2s ease; }
    input:focus { border-color: rgba(87, 224, 255, .68); box-shadow: 0 0 0 3px rgba(59, 190, 255, .1); }
    button { width: 100%; min-height: 50px; margin-top: 23px; border: 0; border-radius: 12px; cursor: pointer; color: #03111d; font-weight: 800; letter-spacing: .02em; background: linear-gradient(135deg, #70efff, #6dffbd); box-shadow: 0 14px 30px rgba(55, 215, 208, .18); }
    button:hover { filter: brightness(1.05); }
    .error { margin: 0 0 16px; padding: 11px 13px; border: 1px solid rgba(255, 99, 122, .3); border-radius: 10px; color: #ffabb8; background: rgba(128, 25, 46, .18); font-size: 13px; }
    footer { margin-top: 22px; display: flex; align-items: center; gap: 8px; color: #617895; font-size: 11px; }
    footer i { width: 7px; height: 7px; border-radius: 50%; background: #55e8af; box-shadow: 0 0 12px #55e8af; }
  </style>
</head>
<body>
  <main>
    <div class="brand">
      <div class="mark">S</div>
      <div><strong>Secure AI</strong><span>Web Security Monitor</span></div>
    </div>
    <h1>Güvenli giriş</h1>
    <p class="intro">Log analiz paneline, yüklemelere ve AI güvenlik asistanına erişmek için oturum açın.</p>
    {% if error_message %}<div class="error" role="alert">{{ error_message }}</div>{% endif %}
    <form method="post" action="{{ url_for('login') }}" autocomplete="on">
      <input type="hidden" name="next" value="{{ next_url }}">
      <label for="username">Kullanıcı adı</label>
      <input id="username" name="username" type="text" autocomplete="username" required autofocus>
      <label for="password">Şifre</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <button type="submit">Panele giriş yap</button>
    </form>
    <footer><i></i><span>Oturumlar izole edilir ve yüklenen loglar kullanıcı çalışma alanında tutulur.</span></footer>
  </main>
</body>
</html>
